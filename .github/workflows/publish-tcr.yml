name: Publish TCR Image

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README_EN.md'
      - 'CONTRIBUTING.md'
      - 'SECURITY.md'
      - 'CODE_OF_CONDUCT.md'
  workflow_dispatch:

permissions:
  contents: read

# 同一时间只跑一个发布，新提交自动取消进行中的旧发布
concurrency:
  group: publish-tcr-${{ github.ref }}
  cancel-in-progress: true

env:
  # 腾讯云 TCR 个人版镜像仓库地址，如 ccr.ccs.tencentyun.com
  REGISTRY: ${{ secrets.TCR_REGISTRY }}
  # 命名空间，如 metapi
  NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
  IMAGE_NAME: metapi

jobs:
  publish-tcr:
    name: Publish TCR Image (linux/amd64)
    # runner 部署在腾讯云服务器上：构建与推镜像走国内网络
    # 需要在 GitHub 账号或本仓库注册 self-hosted runner，否则任务会一直排队
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure TCR secrets are configured
        env:
          TCR_REGISTRY: ${{ secrets.TCR_REGISTRY }}
          TCR_NAMESPACE: ${{ secrets.TCR_NAMESPACE }}
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: |
          missing=""
          [ -z "$TCR_REGISTRY" ] && missing="$missing TCR_REGISTRY"
          [ -z "$TCR_NAMESPACE" ] && missing="$missing TCR_NAMESPACE"
          [ -z "$TCR_USERNAME" ] && missing="$missing TCR_USERNAME"
          [ -z "$TCR_PASSWORD" ] && missing="$missing TCR_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing TCR secrets:$missing"
            exit 1
          fi

      # 直接用 docker login，避免国内 runner 下载 docker/login-action 超时
      - name: Login to TCR
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
        run: echo "$TCR_PASSWORD" | docker login "$REGISTRY" -u "$TCR_USERNAME" --password-stdin

      # 本机 docker daemon 自带层缓存，无需 buildx + GHA 缓存；保留 sha tag 用于回滚
      - name: Build image
        run: |
          docker build \
            -f docker/Dockerfile \
            -t "$REGISTRY/$NAMESPACE/$IMAGE_NAME:latest" \
            -t "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$GITHUB_SHA" \
            .

      # 同区域推送 TCR，秒级完成
      - name: Push image
        run: |
          docker push "$REGISTRY/$NAMESPACE/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$NAMESPACE/$IMAGE_NAME:$GITHUB_SHA"

      - name: Logout
        if: always()
        run: docker logout "$REGISTRY" || true
